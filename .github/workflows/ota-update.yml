name: OTA Update (EAS)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch do EAS Update
        default: production
        type: string
  push:
    branches: [main]

jobs:
  update:
    name: Publica update OTA
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instala dependencias
        run: bun install --frozen-lockfile

      - name: Publica o update
        run: eas update --branch ${{ inputs.branch || 'production' }} --auto --non-interactive
